[unix_http_server]
file=/tmp/recap-supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
umask=077
logfile=%(ENV_SERVE_DIR)s/logs/supervisor.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/tmp/recap-supervisor.pid
childlogdir=%(ENV_SERVE_DIR)s/logs
loglevel=info

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/recap-supervisor.sock

[program:runpod-base]
command=/usr/bin/env -u LLM_API_KEY -u VLLM_API_KEY -u PINGGY_TOKEN -u HF_TOKEN /bin/bash /start.sh
autostart=%(ENV_MANAGE_BASE)s
autorestart=true
priority=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(ENV_SERVE_DIR)s/logs/base.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2

[program:vllm]
command=/bin/bash %(ENV_SERVE_DIR)s/run-vllm.sh
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=60
stopasgroup=true
killasgroup=true
priority=20
redirect_stderr=true
stdout_logfile=%(ENV_SERVE_DIR)s/logs/vllm.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

[program:pinggy]
command=/bin/bash %(ENV_SERVE_DIR)s/run-pinggy.sh
autostart=true
autorestart=true
startsecs=0
stopasgroup=true
killasgroup=true
priority=30
redirect_stderr=true
stdout_logfile=%(ENV_SERVE_DIR)s/logs/pinggy.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
